<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="bg-[#f4f1ec] min-h-screen flex items-center justify-center p-4 font-['Poppins']">
  <!-- Kartu profil utama -->
  <div class="max-w-sm w-full bg-[#fffdfa] rounded-3xl border border-[#e6e0d8] shadow-[0_20px_50px_-20px_rgba(47,42,38,0.25)] p-10 text-center hover:-translate-y-1 transition duration-500">
    <!-- Avatar inisial -->
    <div class="w-24 h-24 mx-auto rounded-full bg-[#8a9a8b]/15 border border-[#8a9a8b]/50 flex items-center justify-center">
      <span class="font-['Playfair_Display'] text-3xl text-[#5f6f61]">FI</span>
    </div>

    <!-- Nama -->
    <h1 class="font-['Playfair_Display'] text-3xl font-semibold text-[#2f2a26] tracking-wide mt-6">Faizah Imealzah</h1>

    <!-- Kelas dan garis pemisah -->
    <p class="text-[11px] uppercase tracking-[0.3em] text-[#8a9a8b] mt-2">Siswa XII RPL</p>
    <div class="w-10 h-px bg-[#d9d2c8] mx-auto my-5"></div>

    <!-- Deskripsi singkat -->
    <p class="font-light text-sm leading-relaxed text-[#7a716a]">Suka membuat aplikasi web dan sedang belajar Laravel</p>

    <!-- Daftar skill -->
    <div class="flex flex-wrap justify-center gap-2 mt-6">
      <span class="border border-[#e6e0d8] text-[#7a716a] text-xs px-3 py-1 rounded-full hover:border-[#8a9a8b] hover:text-[#5f6f61] transition duration-300">Laravel</span>
      <span class="border border-[#e6e0d8] text-[#7a716a] text-xs px-3 py-1 rounded-full hover:border-[#8a9a8b] hover:text-[#5f6f61] transition duration-300">Tailwind</span>
      <span class="border border-[#e6e0d8] text-[#7a716a] text-xs px-3 py-1 rounded-full hover:border-[#8a9a8b] hover:text-[#5f6f61] transition duration-300">HTML</span>
    </div>

    <!-- Tombol hubungi -->
    <button class="w-full mt-8 rounded-full py-3 font-medium text-sm tracking-widest bg-[#2f2a26] text-[#fffdfa] hover:bg-[#8a9a8b] transition duration-300 active:scale-95">Hubungi</button>
  </div>
</body>
</html>
